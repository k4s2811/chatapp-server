services:
  postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "${PG_DBPORT}:${PG_DBPORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
     image: mongodb/mongodb-community-server:latest
     command: mongod --port ${ChatDb_PORT}
     container_name: chatDB
     ports:
       - "${ChatDb_PORT}:${ChatDb_PORT}"
     volumes:
       - mongo_data:/data/db       

  redis:
    image: redis/redis-stack:latest
    container_name: redis_cache
    restart: always
    ports:
      - "6300:6300"           
      - "8003:8001"           
    environment:
      - REDIS_ARGS=--port 6300 --save 60 1 --loglevel warning 
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6300", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  userservice:
    build: ./userservice
    container_name: userservice
    env_file:
      - ./userservice/.env
    environment:
      PG_HOST: postgres
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data: